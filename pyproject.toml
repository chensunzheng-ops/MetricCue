[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "metriccue"
version = "0.1.0rc1"
description = "Evidence-first diagnostics for content operations data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
metriccue = "metriccue.cli:app"

[tool.hatch.build]
exclude = [
  "/.coverage",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.worktrees",
  "/dist",
  "/outputs",
  "/work",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metriccue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/superpowers"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["metriccue"]
