name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src/metriccue
      - run: python -m pytest --cov=metriccue --cov-report=term-missing --cov-fail-under=80
      - run: python -m build
      - name: Run synthetic golden example
        shell: bash
        run: |
          metriccue analyze examples/synthetic_xhs/performance.csv \
            --content examples/synthetic_xhs/content.csv \
            --production examples/synthetic_xhs/production.csv \
            --config examples/synthetic_xhs/metriccue.yaml \
            --as-of 2026-09-12 \
            --output "${RUNNER_TEMP}/metriccue-release-check"
      - name: Validate bundled Skill
        shell: bash
        run: python scripts/validate_skill.py skills/metriccue
      - name: Scan generated artifacts for email and phone patterns
        shell: bash
        run: |
          python - "${RUNNER_TEMP}/metriccue-release-check" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          email = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          phone = re.compile(r"(?<!\d)(?:\+?86[- ]?)?1[3-9]\d{9}(?!\d)")
          hits = [str(path) for path in root.rglob("*") if path.is_file() and any(pattern.search(path.read_text(encoding="utf-8", errors="ignore")) for pattern in (email, phone))]
          if hits:
              raise SystemExit("Sensitive-looking output: " + ", ".join(hits))
          PY
